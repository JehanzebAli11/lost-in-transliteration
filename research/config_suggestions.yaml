    revision: fc05daec18b0a78c049392ed2e771dde82bdf654
    licence: apache-2.0
    gated: false
    size: 27.8B dense, ~55.6 GB BF16
    notes: card claims 201 languages (list not on card); Urdu listed for Qwen3 lineage. Disable thinking mode.
  stronger_alternative:
    id: Qwen/Qwen3.5-122B-A10B-GPTQ-Int4
    revision: 30cd92cba9707a9aba09d1e490ed4b66b78e9606
    licence: apache-2.0
    gated: false
    size: 122B MoE (10B active), ~78.9 GB
  fallback_other_family:
    id: enstazao/Qalb-1.0-8B-Instruct
    revision: 6792251690a01687b7ed19690914321e0c67c738
