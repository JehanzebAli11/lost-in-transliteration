# Suggested config.yaml fragments from the research branch (checked 2026-11-03).
# Every ID below was resolved against the Hugging Face / PyPI / npm / crates APIs on that date.
# Sources and caveats: research/classifiers.md and research/mcp_scanners.md.
# Revisions are the HF commit sha at check time; pin them for reproducibility.

checked_on: "2026-11-03"

# ---------------------------------------------------------------- §4.1 classifiers
classifiers:
  - id: protectai/deberta-v3-base-prompt-injection-v2
    revision: 90c9989b1a342275dd0d1a95aad283c04e075671
    licence: apache-2.0
    gated: false
    labels: {0: SAFE, 1: INJECTION}
    positive_label: INJECTION
    threshold: 0.92            # LLM Guard code default (score > 0.92); card documents none. Also save raw P for AUC.
    max_length: 512
    multilingual: false        # card: does not handle non-English prompts; project archived
  - id: meta-llama/Llama-Prompt-Guard-2-86M
    revision: a8ded8e697ce7c355e395a0df51f94adb4a2fd27
    licence: llama4            # Llama 4 Community License
    gated: true                # manual approval: owner accepts licence on huggingface.co + HF_TOKEN
    labels: {0: BENIGN, 1: MALICIOUS}   # read from public ONNX mirror; re-verify on official repo once access granted
    positive_label: MALICIOUS
    threshold: argmax          # none documented; save P(MALICIOUS)
    max_length: 512            # card: split longer inputs into segments
    multilingual: true         # evaluated en fr de hi it pt es th (not Urdu)
    fallback_if_no_access:
      id: proventra/mdeberta-v3-base-prompt-injection
      revision: b8a89d3096cf11a71d57b283c854f5ae2ed3df83
      licence: mit
      gated: false
      labels: {0: SAFE, 1: INJECTION}
      positive_label: INJECTION
      threshold: argmax
      max_length: 512
  - id: Horizon-Labs/prompt-injection-guard-base
    revision: 8c321b08c01102a0a3a377f8eecda0cab80e8758   # repo updated 2026-10-31; pin
    licence: apache-2.0
    gated: false
    labels: {0: SAFE, 1: INJECTION}
    positive_label: INJECTION
    threshold: 0.5             # documented default
    max_length: 512            # model supports longer; 512 for parity
    multilingual: true         # 30 training languages, Urdu NOT among them
  # optional 4th
  - id: patronus-studio/wolf-defender-prompt-injection
    revision: 24e930776f6b491cade57341ca37304b90fba2c8
    licence: apache-2.0
    gated: false
    labels: {0: benign, 1: injection}   # lowercase in config.json (card says upper case)
    positive_label: injection
    threshold: 0.5
    max_length: 512
    optional: true
# Not recommended for headline numbers (flagged benign smoke text with P>=0.99):
#   deepset/deberta-v3-base-injection, fmops/distilbert-prompt-injection,
#   daniel315a/xlm-roberta-prompt-injection-multilingual

