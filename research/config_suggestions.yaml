  caveat: no model reports a Roman Urdu benchmark; the 20-item smoke test / owner must sign off

# ---------------------------------------------------------------- §6 Phase 3 MCP tools
mcp_sdk: "mcp==2.3.0"   # v2 renamed FastMCP -> MCPServer (from mcp.server.mcpserver import MCPServer)
mcp_scanners:
  - name: cisco-mcp-scanner
    install: "pip install cisco-ai-mcp-scanner==4.8.7"
    licence: apache-2.0
    local_only: true          # with --analyzers yara (do not use 'api' analyzer: needs Cisco account)
    command: "mcp-scanner --analyzers yara --raw stdio --stdio-command {python} --stdio-arg {server}"
    flagged_when: "is_safe == false"
  - name: ramparts
    install: "cargo install ramparts --version 0.8.10"
    rules: "git clone --depth 1 --branch v0.8.10 https://github.com/highflame-ai/ramparts  # set RAMPARTS_RULES_DIR=<clone>/rules"
    licence: apache-2.0
    local_only: true          # no LLM_API_KEY set
    command: "ramparts scan stdio:{python}:{server} --format json"
    pre_run: "rm -f ~/.ramparts/content-baseline.json"
    flagged_when: "yara_results non-empty, ignoring rule MCPToolChanged"
  - name: mcp-guardian
    install: "npm install mcp-guardian@2.4.0"
    licence: mit
    local_only: true
    command: "mcp-guardian --no-config --json {mcp_config_json}"
    flagged_when: "exit code >= 1"
  - name: mcp-context-protector
    install: "git clone https://github.com/trailofbits/mcp-context-protector && git -C mcp-context-protector checkout 05e56c1616f4382ca25eb15bdfc98c4967bbdd74 && cd mcp-context-protector && uv sync"
    licence: apache-2.0
    local_only: true          # LlamaFirewall runs Prompt Guard 2 locally
    requires: HF_TOKEN with meta-llama/Llama-Prompt-Guard-2-86M licence accepted
    command: "uv run mcp-context-protector --review-server --guardrail-provider LlamaFirewall --command '{python} {server}' --server-config-file {tmp_json}"
    flagged_when: "guardrail alert (interactive prompt follows; answer N)"
  # optional: mcp-shield@1.0.4 (MIT; never pass --claude-api-key). False-positives on a param named 'notes'.
  # skipped: snyk-agent-scan (ex mcp-scan) needs SNYK_TOKEN account; mcp-watch is a source-line scanner that missed the fixture.

# ---------------------------------------------------------------- external test set (see research/external_datasets.md)
external_test_sets:
  - name: afrasadat_en_ur
    path: data/external/afrasadat_en_ur.xlsx      # keep git-ignored until licence known
    sha256: b6883922819ca27d01690a9424ed6d89bac15fd1643727dc657246bb9be1a5ad
    columns: {text: prompt, label: label, type: attack_type, lang: Lang}   # Lang values: Urdu / Eng / eng
    variants: [en, ur]                             # no roman_ur, no mixed
    use: test_only_section_4_1                     # not Phase 2 training, not RQ3
    preprocessing: [drop_blank_rows, normalise_lang, dedup_within_language, report_edge_case_separately]
